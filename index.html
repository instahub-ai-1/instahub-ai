<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InstaHub AI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f0f0f;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:500px;
      text-align:center;
    }

    h1{
      font-size:60px;
      margin-bottom:10px;
      font-weight:bold;
    }

    .ai{
      color:#ff3366;
    }

    p{
      color:#ccc;
      margin-bottom:20px;
      font-size:20px;
    }

    input{
      width:100%;
      padding:18px;
      border:none;
      outline:none;
      border-radius:15px;
      font-size:18px;
      margin-bottom:15px;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:15px;
      background:linear-gradient(90deg,#ffb703,#ff006e);
      color:white;
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.02);
    }

    .loader{
      display:none;
      margin-top:20px;
      color:#ffb703;
      font-size:20px;
    }

    .spinner{
      width:35px;
      height:35px;
      border:4px solid #333;
      border-top:4px solid #ffb703;
      border-radius:50%;
      margin:0 auto 10px;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    .card{
      display:none;
      margin-top:25px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      border-radius:25px;
      padding:20px;
      animation:fade 0.5s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .thumb{
      width:100%;
      border-radius:20px;
      margin-bottom:15px;
    }

    .username{
      font-size:35px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .caption{
      color:#ccc;
      margin-bottom:20px;
      font-size:18px;
    }

    .download-btn{
      display:inline-block;
      text-decoration:none;
      background:linear-gradient(90deg,#ff006e,#ffb703);
      color:white;
      padding:16px 35px;
      border-radius:15px;
      font-size:22px;
      font-weight:bold;
      transition:0.3s;
    }

    .download-btn:hover{
      transform:scale(1.05);
    }

  </style>
</head>
<body>

  <div class="container">

    <h1>InstaHub <span class="ai">AI</span></h1>

    <p>Paste your Instagram Reel link below</p>

    <input
      type="text"
      id="link"
      placeholder="Paste Instagram Reel URL..."
    >

    <button onclick="processReel()">
      PROCESS REEL
    </button>

    <div class="loader" id="loader">

      <div class="spinner"></div>

      Processing Reel...

    </div>

    <div class="card" id="card">

      <img
        id="thumb"
        class="thumb"
      >

      <div
        class="username"
        id="username"
      >
        @username
      </div>

      <div
        class="caption"
        id="caption"
      >
        caption
      </div>

      <a
        id="downloadBtn"
        class="download-btn"
        href="#"
        target="_blank"
      >
        DOWNLOAD REEL
      </a>

    </div>

  </div>

  <script>

    async function processReel(){

      const link =
        document.getElementById("link").value;

      const loader =
        document.getElementById("loader");

      const card =
        document.getElementById("card");

      loader.style.display = "block";
      card.style.display = "none";

      try{

        const response = await fetch(

          `http://localhost:3000/download?link=${encodeURIComponent(link)}`

        );

        const data = await response.json();

        loader.style.display = "none";

        if(data.success){

          document.getElementById("thumb").src =
            data.thumbnail;

          document.getElementById("username").innerText =
            "@" + data.username;

          document.getElementById("caption").innerText =
            data.caption;

          document.getElementById("downloadBtn").href =
            data.downloadUrl;

          card.style.display = "block";

        }else{

          alert(data.message);

        }

      }catch(error){

        loader.style.display = "none";

        alert("Server Error");

      }

    }

    document
      .getElementById("link")
      .addEventListener("keypress", function(event){

        if(event.key === "Enter"){

          processReel();

        }

      });

  </script>

</body>
</html>
